# Personalización con IA — the batch preview does its OWN user-auth check internally, and the
# processor is called by the pg_cron every minute (no user JWT). Both MUST stay verify_jwt=false
# so a CLI redeploy never flips them to gateway-JWT (which would 401 the cron and break the
# whole "sigue solo en el servidor" flow).
[functions.personalize-batch]
verify_jwt = false

[functions.process-personalization]
verify_jwt = false

# Serves the Automatización data (owner's support@ activity) to authorized delegates (equipo@)
# without them owning the mailbox. Does its OWN JWT check inside → verify_jwt=false at the gateway.
[functions.automation-view]
verify_jwt = false

# Pulls new Google Form responses into form_responses (service role, owner's stored OAuth token) so
# the Automatización flow advances on its own. Called by the page poll + a cron → verify_jwt=false.
[functions.google-forms-sync]
verify_jwt = false
