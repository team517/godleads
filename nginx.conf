server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache largo para los assets con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Landing exportada de Claude Design (~10 MB autocontenidos). Sin esta regla caería en el
    # "no-store" de abajo y cada visita la volvería a bajar entera. La aplicación la pide con
    # ?v=<versión>, así que al cambiarla la URL cambia y la caché vieja no estorba.
    location /landing/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida sirve index.html (react-router)
    #
    # index.html (y sw.js/manifest) NUNCA se cachean: sin cabecera, Chrome reutilizaba el
    # index viejo tras un "Implementar" y seguía cargando los chunks antiguos — el usuario
    # veía la versión de ayer aunque el servidor ya tuviera la de hoy (2026-09-16).
    # Los chunks en /assets/ llevan hash en el nombre, por eso sí son inmutables arriba.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
