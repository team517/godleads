# Buscadores (10-11-2026): el dominio interno de EasyPanel no debe competir en Google con
# www.funnyleads.com. Los .conf de conf.d se incluyen dentro de http{}, así que el map va aquí.
map $host $fl_robots {
    default "";
    ~*easypanel\.host$ "noindex, nofollow";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # Una sola dirección para Google: funnyleads.com → www.funnyleads.com (misma ruta).
    if ($host = "funnyleads.com") {
        return 301 https://www.funnyleads.com$request_uri;
    }

    # Cache largo para los assets con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag $fl_robots always;
    }

    # Landing exportada de Claude Design (~10 MB autocontenidos). Sin esta regla caería en el
    # "no-store" de abajo y cada visita la volvería a bajar entera. La aplicación la pide con
    # ?v=<versión>, así que al cambiarla la URL cambia y la caché vieja no estorba.
    location /landing/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # La landing va dentro de un marco en la portada: Google la cuenta como contenido de
        # www.funnyleads.com/ (indexifembedded) pero no la indexa como página suelta duplicada.
        add_header X-Robots-Tag "noindex, indexifembedded" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Robots-Tag $fl_robots always;
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida sirve index.html (react-router)
    #
    # index.html (y sw.js/manifest) NUNCA se cachean: sin cabecera, Chrome reutilizaba el
    # index viejo tras un "Implementar" y seguía cargando los chunks antiguos — el usuario
    # veía la versión de ayer aunque el servidor ya tuviera la de hoy (2026-09-16).
    # Los chunks en /assets/ llevan hash en el nombre, por eso sí son inmutables arriba.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Robots-Tag $fl_robots always;
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
